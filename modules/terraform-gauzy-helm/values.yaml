webapp:
  baseUrls:
    api: "https://apidemo.gauzy.co"
    client: "https://demo.gauzy.co"

  cloudinary:
    apiKey: "256868982483961"
    cloudName: "dv6ezkfxg"

  googleMap:
    apiKey: "AIzaSyCJmnKzgTSq5Pc93HXar5bZrdmANTwtSIo"
    defaultLatitude: "42.6459136"
    defaultLongitude: "23.3332736"

  ingress:
    enabled: true
    className: "nginx"
    annotations: 
      kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: demo.gauzy.co
        paths:
          - path: /
            pathType: Prefix
    tls:
     - secretName: chart-example-tls
       hosts:
         - demo.gauzy.co
  envs:
    - name: SENTRY_DSN
      # Your own Sentry DSN, or empty to disable Sentry (never Ever's: forks would report into it).
      value: ""
    - name: CHATWOOT_SDK_TOKEN
      value: "jFoSXEjGmqhUhqU3zfgkFfMt"

ever-gauzy-api:
  global:
    env:
      production: true
    baseUrls:
      api: "https://apidemo.gauzy.co"
      client: "https://demo.gauzy.co"
  loglevel: "info"
  adminPasswordReset: true
  sentry:
    # Your own Sentry DSN, or empty to disable Sentry (never Ever's: forks would report into it).
    sentryDsn: ""
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: apidemo.gauzy.co
        paths:
          - path: /
            pathType: Prefix
    tls:
     - secretName: chart-example-tls
       hosts:
         - apidemo.gauzy.co
  postgresql:
    global:
      imageRegistry: ""
      imagePullSecrets: []
      ##
      storageClass: ""
      postgresql:
        auth:
          postgresPassword: ""
          username: ""
          password: ""
          database: ""
          existingSecret: ""
          secretKeys:
            adminPasswordKey: ""
            userPasswordKey: ""
            replicationPasswordKey: ""
        service:
          ports:
            postgresql: ""
  envs:
    - name: EXPRESS_SESSION_SECRET
      value: "gauzy"
